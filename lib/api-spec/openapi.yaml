openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CIAO Rental Car API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cars
    description: Car fleet operations
  - name: bookings
    description: Booking operations
  - name: availability
    description: Availability operations
  - name: admin
    description: Admin operations
  - name: content
    description: Page content operations
  - name: rooms
    description: Lodging room operations
  - name: rental
    description: Rental car operations (new rich schema)
paths:
  /rooms:
    get:
      operationId: getRooms
      tags: [rooms]
      summary: List published rooms
      description: Returns all published rooms, sorted by sortOrder. Optionally filter to featured rooms only.
      parameters:
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /rooms/{slug}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a single published room by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rooms:
    get:
      operationId: getAdminRooms
      tags: [admin]
      summary: List all rooms (admin, incl. drafts)
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createAdminRoom
      tags: [admin]
      summary: Create a new room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rooms/reorder:
    put:
      operationId: reorderAdminRooms
      tags: [admin]
      summary: Reorder rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRoomsBody"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /admin/rooms/{id}:
    put:
      operationId: updateAdminRoom
      tags: [admin]
      summary: Update a room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomBody"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminRoom
      tags: [admin]
      summary: Delete a room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content/{page}:
    get:
      operationId: getPageContent
      tags: [content]
      summary: Get content for a page
      description: Returns the editable content blob for a given page key (e.g. "home", "rentalcar")
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"

  /content/route/{language}:
    get:
      operationId: getLocalizedHomePage
      tags: [content]
      summary: Get the localized home page
      parameters:
        - name: language
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SupportedLanguage"
      responses:
        "200":
          description: Localized home page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalizedPage"
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content/route/{language}/{slug}:
    get:
      operationId: getLocalizedPage
      tags: [content]
      summary: Resolve a published localized CMS page by URL
      parameters:
        - name: language
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SupportedLanguage"
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Localized CMS page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalizedPage"
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/content:
    get:
      operationId: listAdminContentPages
      tags: [admin]
      summary: List CMS pages (admin)
      responses:
        "200":
          description: CMS page summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPageSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminContentPage
      tags: [admin]
      summary: Create a CMS page (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAdminContentBody"
      responses:
        "201":
          description: Created CMS page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
        "400":
          description: Invalid or conflicting page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /seo/{page}:
    get:
      operationId: getPageSeo
      tags: [content]
      summary: Get SEO metadata for a page
      description: Returns SEO fields for a given page key (e.g. "home", "rentalcar")
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSeo"

  /admin/content/{page}:
    put:
      operationId: updateAdminContent
      tags: [admin]
      summary: Update content for a page (admin)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageContentUpdate"
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminContentPage
      tags: [admin]
      summary: Delete a custom CMS page (admin)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Page deleted
        "400":
          description: Built-in or invalid page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Page not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/seo/{page}:
    put:
      operationId: updateAdminSeo
      tags: [admin]
      summary: Update SEO metadata for a page (admin)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageSeoUpdate"
      responses:
        "200":
          description: Updated SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSeo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cars:
    get:
      operationId: getCars
      tags: [cars]
      summary: List all cars
      description: Returns all cars in the fleet
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"

  /cars/{id}:
    get:
      operationId: getCar
      tags: [cars]
      summary: Get a single car
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cars/{id}/availability:
    get:
      operationId: getCarAvailability
      tags: [availability]
      summary: Get car availability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Availability records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Availability"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Car not available for selected dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get current admin session
      responses:
        "200":
          description: Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/bookings:
    get:
      operationId: getAdminBookings
      tags: [admin]
      summary: List all bookings (admin)
      responses:
        "200":
          description: List of bookings with car info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingWithCar"

  /admin/cars:
    get:
      operationId: getAdminCars
      tags: [admin]
      summary: List all cars (admin)
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
    post:
      operationId: createAdminCar
      tags: [admin]
      summary: Create a new car
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarBody"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/cars/{id}:
    put:
      operationId: updateAdminCar
      tags: [admin]
      summary: Update car details and pricing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarBody"
      responses:
        "200":
          description: Updated car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminCar
      tags: [admin]
      summary: Delete a car
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/cars/{id}/availability:
    post:
      operationId: setCarAvailability
      tags: [admin]
      summary: Set availability for a date range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityBody"
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /rental/vehicles/search:
    get:
      operationId: searchRentalVehicles
      tags: [rental]
      summary: Search available rental vehicles
      parameters:
        - name: pickupAt
          in: query
          required: false
          schema:
            type: string
        - name: returnAt
          in: query
          required: false
          schema:
            type: string
        - name: pickupLocation
          in: query
          required: false
          schema:
            type: string
        - name: returnLocation
          in: query
          required: false
          schema:
            type: string
        - name: slug
          in: query
          required: false
          schema:
            type: string
        - name: adults
          in: query
          required: false
          schema:
            type: integer
        - name: children
          in: query
          required: false
          schema:
            type: integer
        - name: babies
          in: query
          required: false
          schema:
            type: integer
        - name: luggageLarge
          in: query
          required: false
          schema:
            type: integer
        - name: luggageSmall
          in: query
          required: false
          schema:
            type: integer
        - name: vehicleClass
          in: query
          required: false
          schema:
            type: string
        - name: transmission
          in: query
          required: false
          schema:
            type: string
        - name: has4wd
          in: query
          required: false
          schema:
            type: boolean
        - name: winterTires
          in: query
          required: false
          schema:
            type: boolean
        - name: skiLuggage
          in: query
          required: false
          schema:
            type: boolean
        - name: childSeat
          in: query
          required: false
          schema:
            type: boolean
        - name: airportDelivery
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Available and unavailable vehicles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalVehicleSearchResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rental/vehicles:
    get:
      operationId: getRentalVehicles
      tags: [rental]
      summary: List published rental vehicles
      responses:
        "200":
          description: List of rental vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalVehicle"

  /rental/vehicles/{slug}:
    get:
      operationId: getRentalVehicle
      tags: [rental]
      summary: Get a rental vehicle by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Vehicle details with pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalVehicleDetail"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rental/addons:
    get:
      operationId: getRentalAddons
      tags: [rental]
      summary: List published rental add-ons
      responses:
        "200":
          description: List of add-ons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalAddon"

  /rental/reservations/hold:
    post:
      operationId: createRentalHold
      tags: [rental]
      summary: Create a temporary vehicle hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateHoldBody"
      responses:
        "201":
          description: Hold created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalHold"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vehicle not available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rental/reservations/holds/{holdId}:
    get:
      operationId: getRentalHold
      tags: [rental]
      summary: Get temporary vehicle hold status
      parameters:
        - name: holdId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Temporary hold
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalHold"
        "404":
          description: Hold not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rental/reservations:
    post:
      operationId: createRentalReservation
      tags: [rental]
      summary: Create a reservation from a hold
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReservationBody"
      responses:
        "201":
          description: Reservation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalReservationWithPricing"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Vehicle no longer available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rental/pricing/calculate:
    post:
      operationId: calculateRentalPrice
      tags: [rental]
      summary: Calculate rental price breakdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCalculateBody"
      responses:
        "200":
          description: Price breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalPriceBreakdown"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rental/vehicles:
    get:
      operationId: getAdminRentalVehicles
      tags: [admin]
      summary: List all rental vehicles (admin, incl. drafts)
      responses:
        "200":
          description: List of rental vehicles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RentalVehicle"
    post:
      operationId: createAdminRentalVehicle
      tags: [admin]
      summary: Create a new rental vehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRentalVehicleBody"
      responses:
        "201":
          description: Vehicle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalVehicle"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rental/vehicles/{id}:
    get:
      operationId: getAdminRentalVehicle
      tags: [admin]
      summary: Get a single rental vehicle by ID (admin, incl. drafts)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vehicle detail with pricing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RentalVehicleDetail"
        "404":
          description: Vehicle not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateAdminRentalVehicle
      tags: [admin]
      summary: Update a rental vehicle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRentalVehicleBody"
      responses:
        "200":
          description: Updated vehicle
          content:
