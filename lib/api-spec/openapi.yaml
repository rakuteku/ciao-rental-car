components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Car:
      type: object
      properties:
        id:
          type: integer
        model:
          type: string
        name:
          type: string
        year:
          type: integer
        passengerCapacity:
          type: integer
        fuelEfficiency:
          type: number
        pricePerDay:
          type: number
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        description:
          type: ["string", "null"]
      required:
        - id
        - model
        - name
        - year
        - passengerCapacity
        - fuelEfficiency
        - pricePerDay
        - airportPickupFee
        - airportDropoffFee
        - imageUrls
        - imageUrl
        - isAvailable

    CreateCarBody:
      type: object
      properties:
        model:
          type: string
        name:
          type: string
        year:
          type: integer
        passengerCapacity:
          type: integer
        fuelEfficiency:
          type: number
        pricePerDay:
          type: number
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        description:
          type: ["string", "null"]
      required:
        - model
        - name
        - year
        - passengerCapacity
        - fuelEfficiency
        - pricePerDay
        - airportPickupFee
        - airportDropoffFee

    UpdateCarBody:
      type: object
      properties:
        model:
          type: string
        name:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        passengerCapacity:
          type: ["integer", "null"]
        fuelEfficiency:
          type: ["number", "null"]
        pricePerDay:
          type: number
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        description:
          type: ["string", "null"]

    Availability:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
        date:
          type: string
        isAvailable:
          type: boolean
      required:
        - id
        - carId
        - date
        - isAvailable

    Booking:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
        pickupDate:
          type: string
        returnDate:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        totalPrice:
          type: number
        createdAt:
          type: string
      required:
        - id
        - carId
        - pickupDate
        - returnDate
        - pickupLocation
        - returnLocation
        - name
        - email
        - phone
        - airportPickupFee
        - airportDropoffFee
        - totalPrice
        - createdAt

    BookingWithCar:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
        carName:
          type: string
        pickupDate:
          type: string
        returnDate:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        totalPrice:
          type: number
        createdAt:
          type: string
      required:
        - id
        - carId
        - carName
        - pickupDate
        - returnDate
        - pickupLocation
        - returnLocation
        - name
        - email
        - phone
        - airportPickupFee
        - airportDropoffFee
        - totalPrice
        - createdAt

    CreateBookingBody:
      type: object
      properties:
        carId:
          type: integer
        pickupDate:
          type: string
        returnDate:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
      required:
        - carId
        - pickupDate
        - returnDate
        - pickupLocation
        - returnLocation
        - name
        - email
        - phone

    SetAvailabilityBody:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        isAvailable:
          type: boolean
      required:
        - startDate
        - endDate
        - isAvailable

    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AdminLoginResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
      required:
        - authenticated
        - username

    AdminStats:
      type: object
      properties:
        totalBookings:
          type: integer
        totalRevenue:
          type: number
        availableCars:
          type: integer
        totalCars:
          type: integer
        recentBookings:
          type: integer
      required:
        - totalBookings
        - totalRevenue
        - availableCars
        - totalCars
        - recentBookings

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PageContent:
      type: object
      properties:
        page:
          type: string
        title:
          $ref: "#/components/schemas/LocalizedText"
        slugs:
          $ref: "#/components/schemas/LocalizedText"
        content:
          $ref: "#/components/schemas/LocalizedContent"
        published:
          type: boolean
        isCustom:
          type: boolean
        updatedAt:
          type: string
      required:
        - page
        - title
        - slugs
        - content
        - published
        - isCustom
        - updatedAt

    LocalizedContent:
      type: object
      properties:
        en:
          type: object
          additionalProperties: true
        ja:
          type: object
          additionalProperties: true
        zh-CN:
          type: object
          additionalProperties: true
      required: [en, ja, zh-CN]

    PageContentUpdate:
      type: object
      properties:
        title:
          $ref: "#/components/schemas/LocalizedText"
        slugs:
          $ref: "#/components/schemas/LocalizedText"
        content:
          type: object
          properties:
            en:
              type: object
              additionalProperties: true
            ja:
              type: object
              additionalProperties: true
            zh-CN:
              type: object
              additionalProperties: true
        published:
          type: boolean

    LocalizedText:
      type: object
      properties:
        en:
          type: string
        ja:
          type: string
        zh-CN:
          type: string
      required: [en, ja, zh-CN]

    LocalizedKeywords:
      type: object
      properties:
        en:
          type: array
          items: { type: string }
        ja:
          type: array
          items: { type: string }
