openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CIAO Rental Car API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: cars
    description: Car fleet operations
  - name: bookings
    description: Booking operations
  - name: availability
    description: Availability operations
  - name: admin
    description: Admin operations
  - name: content
    description: Page content operations
  - name: rooms
    description: Lodging room operations
paths:
  /rooms:
    get:
      operationId: getRooms
      tags: [rooms]
      summary: List published rooms
      description: Returns all published rooms, sorted by sortOrder. Optionally filter to featured rooms only.
      parameters:
        - name: featured
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /rooms/{slug}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a single published room by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Room details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rooms:
    get:
      operationId: getAdminRooms
      tags: [admin]
      summary: List all rooms (admin, incl. drafts)
      responses:
        "200":
          description: List of rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createAdminRoom
      tags: [admin]
      summary: Create a new room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomBody"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/rooms/reorder:
    put:
      operationId: reorderAdminRooms
      tags: [admin]
      summary: Reorder rooms
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRoomsBody"
      responses:
        "200":
          description: Reordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /admin/rooms/{id}:
    put:
      operationId: updateAdminRoom
      tags: [admin]
      summary: Update a room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomBody"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminRoom
      tags: [admin]
      summary: Delete a room
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "404":
          description: Room not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /content/{page}:
    get:
      operationId: getPageContent
      tags: [content]
      summary: Get content for a page
      description: Returns the editable content blob for a given page key (e.g. "home", "rentalcar")
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"

  /seo/{page}:
    get:
      operationId: getPageSeo
      tags: [content]
      summary: Get SEO metadata for a page
      description: Returns SEO fields for a given page key (e.g. "home", "rentalcar")
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSeo"

  /admin/content/{page}:
    put:
      operationId: updateAdminContent
      tags: [admin]
      summary: Update content for a page (admin)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentBody"
      responses:
        "200":
          description: Updated content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageContent"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/seo/{page}:
    put:
      operationId: updateAdminSeo
      tags: [admin]
      summary: Update SEO metadata for a page (admin)
      parameters:
        - name: page
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSeoBody"
      responses:
        "200":
          description: Updated SEO metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageSeo"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /cars:
    get:
      operationId: getCars
      tags: [cars]
      summary: List all cars
      description: Returns all cars in the fleet
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"

  /cars/{id}:
    get:
      operationId: getCar
      tags: [cars]
      summary: Get a single car
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cars/{id}/availability:
    get:
      operationId: getCarAvailability
      tags: [availability]
      summary: Get car availability
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: startDate
          in: query
          required: false
          schema:
            type: string
        - name: endDate
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Availability records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Availability"

  /bookings:
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Car not available for selected dates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /admin/me:
    get:
      operationId: adminMe
      tags: [admin]
      summary: Get current admin session
      responses:
        "200":
          description: Admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/bookings:
    get:
      operationId: getAdminBookings
      tags: [admin]
      summary: List all bookings (admin)
      responses:
        "200":
          description: List of bookings with car info
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BookingWithCar"

  /admin/cars:
    get:
      operationId: getAdminCars
      tags: [admin]
      summary: List all cars (admin)
      responses:
        "200":
          description: List of cars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Car"
    post:
      operationId: createAdminCar
      tags: [admin]
      summary: Create a new car
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCarBody"
      responses:
        "201":
          description: Car created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/cars/{id}:
    put:
      operationId: updateAdminCar
      tags: [admin]
      summary: Update car details and pricing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCarBody"
      responses:
        "200":
          description: Updated car
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Car"
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminCar
      tags: [admin]
      summary: Delete a car
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Car deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message
        "404":
          description: Car not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/cars/{id}/availability:
    post:
      operationId: setCarAvailability
      tags: [admin]
      summary: Set availability for a date range
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvailabilityBody"
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                  - message

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Dashboard stats
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Car:
      type: object
      properties:
        id:
          type: integer
        model:
          type: string
        name:
          type: string
        year:
          type: integer
        passengerCapacity:
          type: integer
        fuelEfficiency:
          type: number
        pricePerDay:
          type: number
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        description:
          type: ["string", "null"]
      required:
        - id
        - model
        - name
        - year
        - passengerCapacity
        - fuelEfficiency
        - pricePerDay
        - airportPickupFee
        - airportDropoffFee
        - imageUrls
        - imageUrl
        - isAvailable

    CreateCarBody:
      type: object
      properties:
        model:
          type: string
        name:
          type: string
        year:
          type: integer
        passengerCapacity:
          type: integer
        fuelEfficiency:
          type: number
        pricePerDay:
          type: number
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        description:
          type: ["string", "null"]
      required:
        - model
        - name
        - year
        - passengerCapacity
        - fuelEfficiency
        - pricePerDay
        - airportPickupFee
        - airportDropoffFee

    UpdateCarBody:
      type: object
      properties:
        model:
          type: string
        name:
          type: ["string", "null"]
        year:
          type: ["integer", "null"]
        passengerCapacity:
          type: ["integer", "null"]
        fuelEfficiency:
          type: ["number", "null"]
        pricePerDay:
          type: number
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        imageUrl:
          type: string
        isAvailable:
          type: boolean
        description:
          type: ["string", "null"]

    Availability:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
        date:
          type: string
        isAvailable:
          type: boolean
      required:
        - id
        - carId
        - date
        - isAvailable

    Booking:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
        pickupDate:
          type: string
        returnDate:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        totalPrice:
          type: number
        createdAt:
          type: string
      required:
        - id
        - carId
        - pickupDate
        - returnDate
        - pickupLocation
        - returnLocation
        - name
        - email
        - phone
        - airportPickupFee
        - airportDropoffFee
        - totalPrice
        - createdAt

    BookingWithCar:
      type: object
      properties:
        id:
          type: integer
        carId:
          type: integer
        carName:
          type: string
        pickupDate:
          type: string
        returnDate:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        airportPickupFee:
          type: number
        airportDropoffFee:
          type: number
        totalPrice:
          type: number
        createdAt:
          type: string
      required:
        - id
        - carId
        - carName
        - pickupDate
        - returnDate
        - pickupLocation
        - returnLocation
        - name
        - email
        - phone
        - airportPickupFee
        - airportDropoffFee
        - totalPrice
        - createdAt

    CreateBookingBody:
      type: object
      properties:
        carId:
          type: integer
        pickupDate:
          type: string
        returnDate:
          type: string
        pickupLocation:
          type: string
        returnLocation:
          type: string
        name:
          type: string
        email:
          type: string
        phone:
          type: string
      required:
        - carId
        - pickupDate
        - returnDate
        - pickupLocation
        - returnLocation
        - name
        - email
        - phone

    SetAvailabilityBody:
      type: object
      properties:
        startDate:
          type: string
        endDate:
          type: string
        isAvailable:
          type: boolean
      required:
        - startDate
        - endDate
        - isAvailable

    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
        - username
        - password

    AdminLoginResponse:
      type: object
      properties:
        authenticated:
          type: boolean
        username:
          type: string
      required:
        - authenticated
        - username

    AdminStats:
      type: object
      properties:
        totalBookings:
          type: integer
        totalRevenue:
          type: number
        availableCars:
          type: integer
        totalCars:
          type: integer
        recentBookings:
          type: integer
      required:
        - totalBookings
        - totalRevenue
        - availableCars
        - totalCars
        - recentBookings

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    PageContent:
      type: object
      properties:
        page:
          type: string
        content:
          type: object
          additionalProperties: true
      required:
        - page
        - content

    UpdateContentBody:
      type: object
      properties:
        content:
          type: object
          additionalProperties: true
      required:
        - content

    PageSeo:
      type: object
      properties:
        page:
          type: string
        slug:
          type: string
        metaTitle:
          type: string
        metaDescription:
          type: string
        keywords:
          type: array
          items:
            type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string
        updatedAt:
          type: string
      required:
        - page
        - slug
        - metaTitle
        - metaDescription
        - keywords
        - ogTitle
        - ogDescription
        - ogImage
        - updatedAt

    UpdateSeoBody:
      type: object
      properties:
        slug:
          type: string
        metaTitle:
          type: string
        metaDescription:
          type: string
        keywords:
          type: array
          items:
            type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string
      required:
        - slug
        - metaTitle
        - metaDescription
        - keywords
        - ogTitle
        - ogDescription
        - ogImage

    Room:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: string
        title:
          type: string
        roomType:
          type: string
        maxGuests:
          type: integer
        beds:
          type: integer
        size:
          type: string
        floor:
          type: string
        description:
          type: string
        startingPrice:
          type: number
        amenities:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        coverImage:
          type: string
        houseRules:
          type: string
        checkInTime:
          type: string
        checkOutTime:
          type: string
        featured:
          type: boolean
        published:
          type: boolean
        sortOrder:
          type: integer
        metaTitle:
          type: string
        metaDescription:
          type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - slug
        - title
        - roomType
        - maxGuests
        - beds
        - size
        - floor
        - description
        - startingPrice
        - amenities
        - images
        - coverImage
        - houseRules
        - checkInTime
        - checkOutTime
        - featured
        - published
        - sortOrder
        - metaTitle
        - metaDescription
        - ogTitle
        - ogDescription
        - ogImage
        - createdAt
        - updatedAt

    CreateRoomBody:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        roomType:
          type: string
        maxGuests:
          type: integer
        beds:
          type: integer
        size:
          type: string
        floor:
          type: string
        description:
          type: string
        startingPrice:
          type: number
        amenities:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        coverImage:
          type: string
        houseRules:
          type: string
        checkInTime:
          type: string
        checkOutTime:
          type: string
        featured:
          type: boolean
        published:
          type: boolean
        metaTitle:
          type: string
        metaDescription:
          type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string
      required:
        - title

    UpdateRoomBody:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        roomType:
          type: string
        maxGuests:
          type: integer
        beds:
          type: integer
        size:
          type: string
        floor:
          type: string
        description:
          type: string
        startingPrice:
          type: number
        amenities:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            type: string
        coverImage:
          type: string
        houseRules:
          type: string
        checkInTime:
          type: string
        checkOutTime:
          type: string
        featured:
          type: boolean
        published:
          type: boolean
        metaTitle:
          type: string
        metaDescription:
          type: string
        ogTitle:
          type: string
        ogDescription:
          type: string
        ogImage:
          type: string

    ReorderRoomsBody:
      type: object
      properties:
        orderedIds:
          type: array
          items:
            type: integer
      required:
        - orderedIds
