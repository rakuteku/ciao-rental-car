name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ciao_rental_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ciao_rental_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ciao_rental_test
      SESSION_SECRET: ci-session-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/ciao-rental run build
        env:
          PORT: 5000
          BASE_PATH: /
      - run: pnpm --filter @workspace/db run push-force
      - run: pnpm --filter @workspace/api-server exec node ./build.mjs
      - run: pnpm --filter @workspace/api-server exec sh -c 'node --test --test-concurrency=1 ./test/*.test.mjs ./src/lib/*.test.mjs'
      - run: pnpm --filter @workspace/db exec sh -c 'node --test --test-concurrency=1 ./migrations/*.test.mjs'
